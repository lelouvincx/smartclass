name: Update Dbdocs

on:
  push:
    branches:
      - main
    paths:
      - "docs/schema.dbml"
      - "worker/db/migrations/**"
      - ".github/workflows/dbdocs.yml"
      - "package.json"
      - "package-lock.json"

jobs:
  dbdocs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "26.8.1"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Publish schema to dbdocs
        run: npm run db:docs
        env:
          DBDIAGRAM_TOKEN: ${{ secrets.DBDIAGRAM_TOKEN }}
