name: Deploy Worker

on:
  workflow_run:
    workflows: ["Test"]
    types: [completed]
  workflow_dispatch:
    inputs:
      maintenance_only:
        description: Leave maintenance enabled after schema preparation for the one-time reviewed backfill
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: smartclass-production-release
  cancel-in-progress: false

jobs:
  deploy-worker:
    if: >-
      (github.event_name == 'workflow_run' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.conclusion == 'success') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      APP_COMMIT_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false
          ref: ${{ env.APP_COMMIT_SHA }}

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '26.8.1'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Enable application maintenance
        id: maintenance
        run: npx wrangler deploy --config wrangler.production.toml --keep-vars --var APP_MAINTENANCE:true --var APP_COMMIT_SHA:$APP_COMMIT_SHA

      - name: Verify maintenance
        run: node scripts/release-api.mjs closed "$APP_COMMIT_SHA"

      - name: Drain existing requests
        run: sleep 120

      - name: Record D1 restore bookmark
        run: npx wrangler d1 time-travel info smartclass --config wrangler.production.toml --json > d1-restore.json

      - name: Keep restore bookmark
        uses: actions/upload-artifact@v4
        with:
          name: d1-restore-${{ github.run_id }}-${{ github.run_attempt }}
          path: d1-restore.json
          if-no-files-found: error
          retention-days: 7

      - name: Apply remote D1 migrations
        run: npx wrangler d1 migrations apply smartclass --remote --config wrangler.production.toml

      - name: Require completed workspace cutover
        if: ${{ !inputs.maintenance_only }}
        run: node scripts/workspace-release.mjs check --remote --commit "$APP_COMMIT_SHA"

      - name: Require completed curriculum cutover
        if: ${{ !inputs.maintenance_only }}
        run: node scripts/curriculum-release.mjs check --remote --commit "$APP_COMMIT_SHA"

      - name: Deploy frontend
        if: ${{ !inputs.maintenance_only }}
        run: npx wrangler pages deploy dist --project-name smartclass --branch main --commit-hash "$APP_COMMIT_SHA"

      - name: Reopen API
        if: ${{ !inputs.maintenance_only }}
        run: npx wrangler deploy --config wrangler.production.toml --keep-vars --var APP_MAINTENANCE:false --var APP_COMMIT_SHA:$APP_COMMIT_SHA

      - name: Verify open API
        if: ${{ !inputs.maintenance_only }}
        run: node scripts/release-api.mjs open "$APP_COMMIT_SHA"

      - name: Leave failed release in maintenance
        if: ${{ failure() && (steps.maintenance.outcome == 'success' || steps.maintenance.outcome == 'failure') }}
        run: npx wrangler deploy --config wrangler.production.toml --keep-vars --var APP_MAINTENANCE:true --var APP_COMMIT_SHA:$APP_COMMIT_SHA
