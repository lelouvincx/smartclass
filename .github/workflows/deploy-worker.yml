name: Deploy Worker

on:
  workflow_run:
    workflows: ["Test"]
    types: [completed]
  workflow_dispatch:
    inputs:
      force_maintenance:
        description: Use maintenance mode for an approved incompatible release or recovery
        type: boolean
        default: false
      maintenance_only:
        description: Leave maintenance enabled after schema preparation for approved recovery work
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: smartclass-production-release
  cancel-in-progress: false

jobs:
  deploy-worker:
    if: >-
      (github.event_name == 'workflow_run' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.conclusion == 'success') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      APP_COMMIT_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false
          ref: ${{ env.APP_COMMIT_SHA }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '26.8.1'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Plan release mode
        id: plan
        run: |
          flags=()
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.force_maintenance }}" = "true" ]; then
            flags+=(--force-maintenance)
          fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.maintenance_only }}" = "true" ]; then
            flags+=(--maintenance-only)
          fi
          node scripts/release-plan.mjs --candidate "$APP_COMMIT_SHA" --github-output "$GITHUB_OUTPUT" "${flags[@]}"

      - name: Require completed workspace cutover before routine deployment
        if: ${{ steps.plan.outputs.maintenance == 'false' }}
        run: node scripts/workspace-release.mjs check --remote --api-mode open --commit "${{ steps.plan.outputs.live_commit }}"

      - name: Require completed curriculum cutover before routine deployment
        if: ${{ steps.plan.outputs.maintenance == 'false' }}
        run: node scripts/curriculum-release.mjs check --remote --api-mode open --commit "${{ steps.plan.outputs.live_commit }}"

      - name: Enable application maintenance
        if: ${{ steps.plan.outputs.maintenance == 'true' }}
        id: maintenance
        run: npx wrangler deploy --config wrangler.production.toml --keep-vars --var APP_MAINTENANCE:true --var APP_COMMIT_SHA:$APP_COMMIT_SHA

      - name: Verify maintenance
        if: ${{ steps.plan.outputs.maintenance == 'true' }}
        run: node scripts/release-api.mjs closed "$APP_COMMIT_SHA"

      - name: Drain existing requests
        if: ${{ steps.plan.outputs.maintenance == 'true' }}
        run: sleep 120

      - name: Record D1 restore bookmark
        if: ${{ steps.plan.outputs.maintenance == 'true' }}
        run: npx wrangler d1 time-travel info smartclass --config wrangler.production.toml --json > d1-restore.json

      - name: Keep restore bookmark
        if: ${{ steps.plan.outputs.maintenance == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: d1-restore-${{ github.run_id }}-${{ github.run_attempt }}
          path: d1-restore.json
          if-no-files-found: error
          retention-days: 7

      - name: Apply remote D1 migrations
        if: ${{ steps.plan.outputs.maintenance == 'true' }}
        run: npx wrangler d1 migrations apply smartclass --remote --config wrangler.production.toml

      - name: Require completed workspace cutover
        if: ${{ steps.plan.outputs.maintenance == 'true' }}
        run: node scripts/workspace-release.mjs check --remote --commit "$APP_COMMIT_SHA"

      - name: Require completed curriculum cutover
        if: ${{ steps.plan.outputs.maintenance == 'true' }}
        run: node scripts/curriculum-release.mjs check --remote --commit "$APP_COMMIT_SHA"

      - name: Deploy frontend
        if: ${{ steps.plan.outputs.maintenance_only == 'false' }}
        run: npx wrangler pages deploy dist --project-name smartclass --branch main --commit-hash "$APP_COMMIT_SHA"

      - name: Deploy open API
        if: ${{ steps.plan.outputs.maintenance_only == 'false' }}
        id: deploy_api
        run: npx wrangler deploy --config wrangler.production.toml --keep-vars --var APP_MAINTENANCE:false --var APP_COMMIT_SHA:$APP_COMMIT_SHA

      - name: Verify open API
        if: ${{ steps.plan.outputs.maintenance_only == 'false' }}
        run: node scripts/release-api.mjs open "$APP_COMMIT_SHA"

      - name: Leave failed release in maintenance
        if: >-
          ${{
            failure() &&
            (steps.maintenance.outcome == 'success' || steps.maintenance.outcome == 'failure' ||
              steps.deploy_api.outcome == 'success' || steps.deploy_api.outcome == 'failure')
          }}
        run: npx wrangler deploy --config wrangler.production.toml --keep-vars --var APP_MAINTENANCE:true --var APP_COMMIT_SHA:$APP_COMMIT_SHA
