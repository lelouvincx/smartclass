name: Deploy Worker

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy-worker:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '26.8.1'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm test

      - name: Run worker tests
        run: npm run test:worker

      - name: Run integration tests
        run: npm run test:integration

      - name: Build frontend
        run: npm run build

      - name: Sync JWT secret
        run: echo "${{ secrets.JWT_SECRET }}" | npx wrangler secret put JWT_SECRET

      - name: Apply remote D1 migrations
        run: npx wrangler d1 migrations apply smartclass --remote

      - name: Deploy Worker
        run: npx wrangler deploy --var APP_ENV:production --var APP_CORS_ORIGIN:https://smartclass.lelouvincx.com --var APP_COMMIT_SHA:${{ github.sha }}

      - name: Verify deployed commit
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          for attempt in {1..12}; do
            deployed_commit=$(curl --fail --silent https://api.smartclass.lelouvincx.com/api/version | jq -r '.data.commit // empty' 2>/dev/null || true)

            if [ "$deployed_commit" = "$EXPECTED_COMMIT" ]; then
              echo "Production API is running commit $EXPECTED_COMMIT"
              exit 0
            fi

            echo "Attempt $attempt: production reports ${deployed_commit:-no commit}; retrying"
            sleep 5
          done

          echo "Production API did not report expected commit $EXPECTED_COMMIT"
          exit 1
