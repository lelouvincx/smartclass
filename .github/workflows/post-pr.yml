name: Post PR Approval

on:
  pull_request_review:
    types: [submitted]

permissions:
  contents: read

jobs:
  approval:
    if: github.event.review.state == 'approved'
    runs-on: ubuntu-latest
    steps:
      - name: Record approval
        run: |
          echo "Approval recorded for PR #${{ github.event.pull_request.number }}"
